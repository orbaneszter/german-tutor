<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German C2 Tutor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d2430; --muted: #5d6675; --line: #dfe3e8;
    --accent: #1f4e8c; --accent-soft: #e6eef8; --good: #1e7a46; --good-soft: #e3f3ea;
    --mid: #9a6700; --mid-soft: #fbf0d9; --bad: #b42318; --bad-soft: #fbe6e4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --card: #1d2128; --text: #e7eaee; --muted: #a2abb8; --line: #333a45;
      --accent: #8db4ec; --accent-soft: #23324a; --good: #6fcf97; --good-soft: #1d3428;
      --mid: #e8b94f; --mid-soft: #3a3020; --bad: #f28b82; --bad-soft: #3d2423;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 860px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 4px 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; margin-right: auto; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: .95rem; }
  nav a:hover { background: var(--accent-soft); color: var(--text); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 16px 0 6px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .note { font-size: .9rem; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 14px 0; }
  .card.soft { background: var(--accent-soft); border-color: transparent; }
  button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; }
  button.small { padding: 4px 10px; font-size: .9rem; }
  button.link { border: none; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.spread { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 16px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .progress.timer > div { background: var(--mid); transition: width 1s linear; }
  .prompt { font-size: 1.15rem; margin: 6px 0 14px; white-space: pre-wrap; }
  .instruction { font-weight: 600; margin: 4px 0; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  input[type=text].wide { width: 100%; }
  select { max-width: 100%; }
  input.gap { padding: 2px 6px; font-size: 1.05rem; border-color: var(--accent); min-width: 5ch; }
  textarea { width: 100%; min-height: 120px; }
  textarea.essay { min-height: 300px; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  .options { display: grid; gap: 8px; }
  .options button { text-align: left; padding: 10px 14px; }
  .options button .key { display: inline-block; min-width: 1.6em; color: var(--muted); }
  .options button.picked { border-color: var(--accent); background: var(--accent-soft); }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; margin: 6px 0; }
  .tiles.placed { border-style: solid; border-color: var(--accent); }
  .tile { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .tile:hover { border-color: var(--accent); }
  .start { padding: 4px 2px; font-weight: 600; }
  .verdict { font-weight: 700; font-size: 1.1rem; padding: 8px 12px; border-radius: 8px; margin: 12px 0 8px; }
  .v-R { background: var(--good-soft); color: var(--good); }
  .v-W { background: var(--bad-soft); color: var(--bad); }
  .v-U { background: var(--mid-soft); color: var(--mid); }
  .explain { border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .82rem; white-space: nowrap; background: var(--line); color: var(--text); }
  .t-good { background: var(--good-soft); color: var(--good); }
  .t-mid { background: var(--mid-soft); color: var(--mid); }
  .t-bad { background: var(--bad-soft); color: var(--bad); }
  .t-acc { background: var(--accent-soft); color: var(--accent); }
  .big { font-size: 1.3rem; font-weight: 700; }
  .clock { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat { font-size: 1.6rem; font-weight: 700; }
  .list { padding-left: 1.2em; margin: 6px 0; }
  .list li { margin: 3px 0; }
  .taskcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--card); text-align: left; width: 100%; }
  .taskcard:hover { border-color: var(--accent); }
  .taskcard.on { border-color: var(--accent); background: var(--accent-soft); }
  .hidden { display: none !important; }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: var(--accent); }
  kbd { font: .85rem ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  @media (max-width: 560px) { .card { padding: 14px; } .prompt { font-size: 1.05rem; } nav a { padding: 6px 7px; } }
  @media print { header, button, .noprint { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">German C2 Tutor <a id="syncDot" href="#setup" class="note" style="font-weight:400;text-decoration:none;margin-left:6px"></a></span>
    <nav id="nav">
      <a href="#today">Today</a>
      <a href="#drills">Drills</a>
      <a href="#write">Writing</a>
      <a href="#progress">Progress</a>
      <a href="#exam">Exam</a>
      <a href="#setup">Setup</a>
    </nav>
  </div>
</header>
<main id="view"><p class="muted">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data/curriculum.js"></script>
<script src="js/app.js"></script>
</body>
</html>
